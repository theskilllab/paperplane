name: paperplane
description: Open-source mobile client (iOS, iPadOS, Android) for a self-hosted Paperclip.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Every new dependency needs a justification in its PR (see CONTRIBUTING.md).
# No telemetry, analytics, crash-reporting or push packages.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
