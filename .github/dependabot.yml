version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  # Flutter generates the CocoaPods/SPM manifests under ios/ on first iOS
  # build. Dependabot reports "no manifest" until they are committed.
  - package-ecosystem: cocoapods
    directory: /ios
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
