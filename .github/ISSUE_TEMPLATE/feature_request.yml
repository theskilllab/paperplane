name: Feature request
description: Propose a change or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Features beyond small fixes start here, before any PR.
        **Never paste tokens, board keys, cookies or private server URLs.**
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This needs no telemetry, push notifications or background fetch.
          required: true
        - label: I removed all tokens, keys and private URLs from this request.
          required: true
